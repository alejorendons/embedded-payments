# ── Perfil E2E: Base de datos H2 en memoria (sin PostgreSQL requerido) ──────────

spring.datasource.url=jdbc:h2:mem:e2edb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Deshabilitar import de .env para evitar sobrescribir la URL
spring.config.import=

# Consola H2 accesible en http://localhost:8085/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

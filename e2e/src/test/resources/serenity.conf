serenity {
  project.name = "Embedded Payments – E2E Screenplay"
  take.screenshots = FOR_EACH_ACTION
  requirement.types = "epic, feature"
}

restassured {
  baseUri = "http://localhost:8085"
}

webdriver {
  driver = chrome
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = ["--start-maximized", "--remote-allow-origins=*"]
    }
  }
}

environments {
  default {
    webdriver.base.url = "http://localhost:5173"
  }
}
